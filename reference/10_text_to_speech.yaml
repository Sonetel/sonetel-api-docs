openapi: 3.1.0
info:
  version: '2.0'
  title: Text to speech
  description: |
    Use our text-to-speech (TTS) API to quickly create professional voice messages for your IVR and other voice apps.

    ## Convert text to a voice message

    Get started in a few easy steps.

    - **Prepare the text**<br>Prepare the message that you wish to record.
    - **Get access token**<br>Use the `/oauth/token` endpoint to get an access token.
    - **Select the language & voice**<br>The TTS API allows you to convert text from almost any language into a voice message. Within each language we also offer variations in voices such as male or female. Send a `GET` request to `/tts/prompt/voice` to get a list of all the voice and language variations available.
    - **Send the request**<br>Issue a `POST` request to the `/convert` endpoint with the text to be converted, the language and the name of the voice to be used sent as a `JSON` body.
    - **Download the file**<br>The response contains a link to the recorded audio file - download the file and use it in your voice apps.

    > The audio file is in the WAV format.

    ### Sample code

    <!--
    type: tab
    title: curl
    -->

    ```bash
    curl \
      --request GET 'https://public-api.sonetel.com/tts/prompt/convert' \
      --header 'Accept: application/json, text/plain, */*' \
      --header 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
      --data-raw '{ "text": "Hello, welcome to Company", "language": "en_GB", "voice": "en-GB-Neural2-A" }'
    ```

    <!--
    type: tab
    title: Python
    -->

    ```python
    import requests
    import os
    from sonetel import api
    import json

    user = os.environ.get('sonetelUserName')
    pswd = os.environ.get('sonetelPassword')

    s = api.Account(username=user,password=pswd)

    url = "https://public-api.sonetel.com/tts/prompt/convert"

    payload = json.dumps({
      "text": "Hello, welcome to ABC Company",
      "language": "en_GB",
      "voice": "en-GB-Neural2-A"
    })

    headers = {
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/plain, */*',
      'Authorization': f'Bearer {s.get_token()}'
    }

    response = requests.request("POST", url, headers=headers, data=payload)

    print(response.json())

    ```

    > **Note**: Enter the command `pip install sonetel` in a terminal window to install our [Python module](https://pypi.org/project/sonetel/) used in the code above.

    <!-- type: tab-end -->


    ## What languages and voices are available?

    The TTS API supports many different languages and voices. To get a list, follow these instructions.

    - **Get access token**<br>Use the `/oauth/token` endpoint to get an access token.
    - **Send API request**<br>Send a `GET` request to `/tts/prompt/voice` with the access token in the `Authorization` header.
    - **Review the results**<br>The JSON response contains all the possible voices and languages that can be used.

    ### Sample code

    <!--
    type: tab
    title: curl
    -->

    ```bash
    curl \
      --request GET 'https://public-api.sonetel.com/tts/prompt/voice' \
      --header 'Accept: application/json, text/plain, */*' \
      --header 'Authorization: Bearer YOUR_ACCESS_TOKEN'
    ```

    <!--
    type: tab
    title: Python
    -->

    ```python
    import requests
    import os
    from sonetel import api

    user = os.environ.get('sonetelUserName')
    pswd = os.environ.get('sonetelPassword')

    s = api.Account(username=user,password=pswd)

    url = "https://public-api.sonetel.com/tts/prompt/voice"


    headers = {
      'Accept': 'application/json, text/plain, */*',
      'Authorization': f'Bearer {s.get_token()}'
    }

    response = requests.request("GET", url, headers=headers)

    print(response.text)

    ```

    > **Note**: Enter the command `pip install sonetel` in a terminal window to install our [Python module](https://pypi.org/project/sonetel/) used in the code above.

    <!-- type: tab-end -->


    ### Sample response Arabic

    ```json
    {
        "statusCode": 200,
        "response": [
            {
                "language": "ar_XA",
                "language_label": "Arabic (XA)",
                "voice": "ar-XA-Wavenet-A",
                "speaker": "A",
                "gender": "Female",
                "default_variant": true,
                "default_voice": true
            },
            {
                "language": "ar_XA",
                "language_label": "Arabic (XA)",
                "voice": "ar-XA-Wavenet-B",
                "speaker": "B",
                "gender": "Male",
                "default_variant": false,
                "default_voice": false
            }
          ]
      }
    ```

    ## What are the charges?

    Charges for using the TTS API depends on your plan.

    |Plan |Free usage (requests per month) | Overuse charges (per started minute) |
    |-----|------|------------|
    | Free | 100| $0.05|
    | Premium | 500 | $0.02 |
    | Business | 1500 | $0.015 |


    > Please note that there is no charge for playing the generated audio files to callers. We only charge for creating the file.
servers:
  - url: 'https://public-api.sonetel.com'
    description: Production
paths:
  /tts/prompt/convert:
    post:
      summary: Convert voice message
      description: |
        This endpoint can be used to convert text into a voice message which can then be played to any IVR or voice app of your choice.

        Use the sample code below to get started.


        <!--
        type: tab
        title: curl
        -->

        ```bash
        curl \
          --request GET 'https://public-api.sonetel.com/tts/prompt/convert' \
          --header 'Accept: application/json, text/plain, */*' \
          --header 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
          --data-raw '{ "text": "Hello, welcome to Company", "language": "en_GB", "voice": "en-GB-Neural2-A" }'
        ```

        <!--
        type: tab
        title: Python
        -->

        ```python
        import requests
        import os
        from sonetel import api
        import json

        user = os.environ.get('sonetelUserName')
        pswd = os.environ.get('sonetelPassword')

        s = api.Account(username=user,password=pswd)

        url = "https://public-api.sonetel.com/tts/prompt/convert"

        payload = json.dumps({
          "text": "Hello, welcome to ABC Company",
          "language": "en_GB",
          "voice": "en-GB-Neural2-A"
        })

        headers = {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/plain, */*',
          'Authorization': f'Bearer {s.get_token()}'
        }

        response = requests.request("POST", url, headers=headers, data=payload)

        print(response.json())

        ```

        > **Note**: Enter the command `pip install sonetel` in a terminal window to install our [Python module](https://pypi.org/project/sonetel/) used in the code above.

        <!-- type: tab-end -->
