    Text-section:
      type: object
      title: Text-section
      description: |-
        A section of text which is a part of a longer text. A section has a `type` and `status`
        `type` may be used by user interfaces to render the section in a certain way
        `status` indicates if the text in the section is ready or still being written
      properties:
        id:
          type: string
          description: The Id of the section
          examples:
            - gb36765
        type:
          type: string
          enum:
            - title
            - intro
            - list-numbered
            - list-bulleted
            - list-item
            - h1
            - h2
            - text
          description: 'The type of text in this section. If the type is a list type, the `text_list` field carries the list of texts. If type is a non-list type, the field  `text_data` carries the text'
        text_data:
          $ref: '#/components/schemas/Text-data-simple'
        text_list:
          type: array
          description: 'If the text section is of type `list-numbered` or `list-bulleted`, the text_list contains the text sections for each item in the list.'
          items:
            $ref: '#/components/schemas/Text-section'
        next_id:
          type: string
          description: The reference pointing to the Id of the next section in sequence
          examples:
            - nj3ju876
        is_first:
          type: boolean
          description: Indicates if this item is the first item in the list. Only one item (the first one) in a list has this set true. Absence of this field indicates `false`
