  schemas:
    InUseWith:
      type: array
      title: InUseWith
      description: List of services a text is in use with.
      items:
        type: object
        properties:
          service:
            type: string
            enum:
              - meeting-minutes
              - business-desc
              - blog-title-list
              - blog
              - vmail-summary
              - call-summary
            description: The service the text is in use with
          auto_expire:
            type: string
            description: Automatic expiry timestamp when the text is no longer required by the service. An empty value implies that the text is never automatically deleted.
            format: date-time
    Text-version-object-no-Id:
      type: object
      title: Text-version-object-no-id
      description: 'A version of text with the various text data, status and meta-data'
      properties:
        processed_text:
          type: string
        completion_text:
          type: string
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
          default: not_started
          examples:
            - in_progress
        error:
          type: object
          properties:
            code:
              type: string
              description: The error code in case of failure
            error_description:
              type: string
              description: A textual description of the error
        meta_data:
          $ref: '#/components/schemas/Meta-data'
        user_input:
          type: string
      required:
        - status
    Meta-data:
      title: Meta-data
      description: The meta data associated to a version of the text. The meta-data may take the structure of any of any of the text types depending on the type of text stored
      oneOf:
        - $ref: '#/components/schemas/Business-description'
        - $ref: '#/components/schemas/Web-page'
        - $ref: '#/components/schemas/Blog-title-list'
        - $ref: '#/components/schemas/Blog'
        - $ref: '#/components/schemas/Meeting-minutes'
        - $ref: '#/components/schemas/Call-summary'
    Business-description:
      $ref: '#/components/schemas/Text-data-simple'
      title: Business description
      description: |-
        Business description with partially (still being written) or completed text.
        If status is `in_progress`, `text_data` may have part of the text available. The `text_data` continues to get updated until the status changes to `ready`.
    Text-data-simple:
      type: object
      title: Text-data-simple
      description: Simple text data with status
      properties:
        text_data:
          type: string
          description: The completed or partially ready (still being written) text data
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - ready
            - ready_limited
          description: |-
            The status of the text data.

            `ready`: Text is fully ready and available on `text_data`
            <br>`ready-limited`: Text is ready, but API only returns a part of the text or no text. This is due to restrictions with your account. An upgrade or purchase may be required to get access to full text.
            <br>`not_started`: no part of text is available yet
            <br>`in_progress`: text is being written. The `text_data` may have partially written text
            his text)
            <br>`failed`: Text generation has failed. The `error_code` and `error_description` provide more details
          examples:
            - in_progress
        error:
          type: object
          properties:
            code:
              type: string
              description: The error code in case of failure
              examples:
                - 4001233-yt
            error_description:
              type: string
              description: A textual description of the error
              examples:
                - Not enough AI credits
    Web-page:
      type: object
      title: Web-page
      description: 'Web page information along with the URL, raw text references and additional fields'
      properties:
        url:
          type: string
          description: The page URL
          format: uri-reference
          examples:
            - 'https://sonetel.com/en/services/virtual-phone-numbers/'
        page_summary:
          $ref: '#/components/schemas/Text-data-simple'
          description: A summary of the web page with status
        page_type:
          type: string
          enum:
            - home
            - contact
            - product
            - other
          description: The type of page
          examples:
            - contact
        meta_description:
          type: string
          description: Meta description for the page
          examples:
            - Have your own local phone number in any city and country of choice. Answer calls anywhere. From $1.79 per month.
        title:
          type: string
          description: The title of the page
          examples:
            - Be a Global Entrepreneur
        text_info:
          $ref: '#/components/schemas/Text-info'
    Text-info:
      type: object
      title: Text-info
      description: Information about the text
      properties:
        text_id:
          type: string
          description: Text Id of the text object
        account_id:
          type: string
        business_id:
          type: string
        user_id:
          type: string
        update_date:
          type: string
          format: date-time
        version:
          type: number
          minimum: 1
          examples:
            - 2
        user_input:
          type: string
          description: User feedback provided for generating description
        language:
          type: string
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
          description: The overall status of the latest version of the text
          examples:
            - in_progress
        in_use_with:
          $ref: '#/components/schemas/InUseWith'
          description: The services this text is in use with
    Blog-title-list:
      type: object
      title: Blog-title-list
