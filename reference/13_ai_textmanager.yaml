openapi: 3.1.0
info:
  version: '2.0'
  title: Text Manager
  summary: The text manager to store and manage Sonetel AI generated text
  description: |-
    The Sonetel Text manager is where AI generated text, created and processed, by the Sonetel /ai-services is stored and managed.
    The generated text along with various fields and meta-data is available via this API.
    All text is versioned with the default operations always occuring on the latest version of the text.
    The API also enables you to view and manage individual versions.
    All operations are authenticated using the [Sonetel access token](Authentication.yaml).
    In order to provide additional segmentation (such as to segment texts for your users/customers), use `business-id` for setting context for stored text by specifying your user or customer Id as `business_id`
    Each text must have a `type` which indicates what type of text it is.

    ## Definitions

    ### Text_Id
    Text used or managed by the AI services is stored in text objects. Text_Id is a unique Id assigned to each text object that contains the text, its properties (such as language, type etc.).
    Each text may many versions, each having its own properties and associated meta data.

    ### Text type
    A text object may be a specific `type`. Here is the list of currenty support types.

    `business-description` `blog-title-list` `blog-article` `poem` `marketing-email` `website` `webpage` `meeting-minutes` `vm-summary` `call-summary`

    ### Version
    A text may have many versions at any point in time, generally created based on user feedback. Versions start with `1` and increment sequentially. Versions can be created, deleted or specific versions of text may be updated.
    There is always a `latest_version` of a text.
    Each version of text has properties and meta-data associated to it.


    ### Input text
    Input text is textual instructions that a may be provided to the Sonetel AI to do its job. Input text is used by the Sonetel AI while generating completion text

    ### Completion text
    Completion text is the original Sonetel AI generated raw text, created based on user requests and/or feedback. This text is processed and enriched to generate final processed text. Meta data may also be generated during processing.

    ### Processed text
    Processed text is the final generated text after all processing has been done by the Sonetel AI services. The `status` specifies if the text is processed completely or not

    ### Meta-data
    Meta data of a text version. Details TBD


    ## Use cases

    ### Create Text

    To create a text object, send a `POST` request to [/textmgr/text](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)

    The API returns the new text object created.
    Version `1` of the text is also automatically created.

    ### Create a new version of text

    To create a new version of a text, send a `POST` to the [/textmgr/text/{text_id}/version](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text~1{text_id}~1version).

    The new version is automatically set as the latest version and is also returned in the response.


    ### Get list of texts in an account

    To get the list of texts in an account based on various search criteria, use the [List text API]((reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)).
    You will receive the latest text version. You may optionally request additional information about the text by specifying `fields` in the request.

    Get list of texts in your account
    <br>`GET` [/textmgr/text](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)
    <br><br>To get a specific type of text (e.g. a list of blog titles) along with the actual textual list in html
    <br>`GET` [/textmgr/text?type=blog-title-list&fields=processed_text&format=html](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)

    ### Get text using a text_id

    To get a specific text, use `GET` [/textmgr/text/{text_id}](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text).

    The latest version of text is returned by default. You may optionally request to get a specific version, or get all versions of the text, optionally with meta_data and other information

    To get a specific text and information about the latest version
    <br>`GET` [/textmgr/text/text_id](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)


    To get a list of versions of the text and the processed data for each version
    <br>`GET` [/textmgr/text/text_id?version=all&fields=processed_data](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text)


    ### Reset the latest version

    To set a specific text version as the latest version, delete the version after it. This automatically sets the specified version as the latest.

    `DELETE` [/textmgr/text/{text_id}/version/{version}](13_ai_textmanager.yaml/paths/~1textmgr~1text~1{text_id}~1version~1{version}).

    For e.g. to set version `3` as latest, delete version `4`

    ### Delete a text

    To delete a specific text, issue a `DELETE` to [/textmgr/text/text_id](reference/13_ai_textmanager.yaml/paths/~1textmgr~1text~1{text_id})

    All versions of the text are deleted
  termsOfService: 'https://sonetel.com/en/help/help-topics/terms-conditions/terms-conditions/'
  contact:
    name: Sonetel API Support
    url: www.sonetel.com
    email: api.support@sonetel.com
servers:
  - url: 'https://public-api.sonetel.com'
    description: Production
paths:
  /textmgr/text:
    get:
      summary: List texts
      description: 'Fetch a list of text objects based on criteria. The response returns a list of text objects and associated fields. Optionally, the latest version of each text may also be returned.'
      operationId: get-textmgr-text
      parameters:
        - name: account_id
          in: query
          description: The Sonetel account id
          schema:
            type: string
            examples:
              - '52688784'
          examples:
            default:
              value: '52688784'
        - name: business_id
          in: query
          description: The business Id for which texts should be returned
          schema:
            type: string
            examples:
              - 2hngtre
        - name: language
          in: query
          description: 'Text available in this language should be returned. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
          schema:
            type: string
            minLength: 2
            maxLength: 35
            default: en
            examples:
              - sv-sv
        - name: user_id
          in: query
          description: Texts associated to this user_id should be returned
          schema:
            type: string
            examples:
              - '19876'
          examples:
            default:
              value: '19876'
        - name: type
          in: query
          description: Texts of this type are returned
          schema:
            type: string
            enum:
              - business-description
              - blog-title-list
              - blog-article
              - poem
              - marketing-email
              - website
              - webpage
              - meeting-minutes
              - vm-summary
              - call-summary
            examples:
              - business-description
        - name: fields
          in: query
          description: 'Specify (comma separated) what additional fields are required to be returned. The default response only carries limited fields. Possible values: `processed_text` `completion_text` `status` `meta_data` `user_input`'
          schema:
            type: string
            examples:
              - 'processed_text,meta_data'
        - name: create_date
          in: query
          description: 'Filter create date with operators `*__gte*` (Greater than or equal to), `*__lte*` (Less than or equal to), or `*=*`'
          schema:
            type: string
            examples:
              - 'create_date__gte''2019-08-24T14:15:22Z'''
        - name: update_date
          in: query
          description: 'Filter update date with operators `*__gte*` (Greater than or equal to), `*__lte*` (Less than or equal to), or `*=*`'
          schema:
            type: string
            examples:
              - 'update_date__lte''2019-08-24T14:15:22Z'''
      responses:
        '200':
          $ref: '#/components/responses/Text-list'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
    post:
      summary: Create a text
      description: Create a new text object. The version 1 of the text is automatically created and set as the latest version
      operationId: post-textmgr-text
      requestBody:
        $ref: '#/components/requestBodies/Post-text'
      responses:
        '200':
          $ref: '#/components/responses/Create-text-response'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
    delete:
      summary: Delete many text(s)
      description: Delete a set of texts and all associated versions. This API may be used when many text objects need to be deleted together
      operationId: delete-textmgr-text
      parameters:
        - name: account_id
          in: query
          description: Sonetel account Id for which texts are to be deleted
          required: true
          schema:
            type: string
            examples:
              - '52688784'
          examples:
            default:
              value: '52688784'
        - name: business_id
          in: query
          description: Business for which all texts are to be deleted
          schema:
            type: string
            examples:
              - 2hngtre
        - name: type
          in: query
          description: Type of text which should be deleted
          schema:
            type: string
            enum:
              - business-description
              - blog-title-list
              - blog-article
              - poem
              - marketing-email
              - website
              - webpage
              - meeting-minutes
              - vm-summary
              - call-summary
      responses:
        '202':
          $ref: '#/components/responses/delete-success'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
  '/textmgr/text/{text_id}':
    get:
      summary: GET text by id
      description: |-
        Fetch a text by Id.
        You can specify one or more versions of the text. You may also specify which fields of the text should be returned.
      operationId: get-textmgr-text-text-id
      parameters:
        - name: version
          in: query
          description: 'Specify version required. If not specified, the latest is fetched. If `all` is specified, all versions are fetched. A specific version fetches the single required version'
          schema:
            type: integer
            examples:
              - 3
        - name: format
          in: query
          description: Specify the format in which text should be returned
          schema:
            type: string
            enum:
              - json
              - html
              - pdf
            default: json
            examples:
              - html
        - name: fields
          in: query
          description: Specify what fields are required
          schema:
            type: string
            enum:
              - processed_text
              - completion_text
              - user_input
              - meta_data
            examples:
              - processed_text
        - name: text_id
          in: path
          description: The text Id being updated
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-text-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
    put:
      summary: Update text fields
      description: 'Updates text fields such as `user_id`, `business_id`'
      operationId: put-ai-textman-text-text-id
      parameters:
        - name: text_id
          in: path
          description: The text Id being updated
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/Put-text-id'
      responses:
        '200':
          $ref: '#/components/responses/Put-text-id-response'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
    delete:
      summary: Delete a text
      description: |-
        Delete a text. This deletes all versions of the text.
        The deleted text is returned
      operationId: delete-ai-textmgr-text-text-id
      parameters:
        - name: text_id
          in: path
          description: The text Id being updated
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-text-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
  '/textmgr/text/{text_id}/version':
    post:
      summary: Create text version
      description: Create a new version of the text and set that as the latest
      operationId: post-textmgr-text-text-id-version
      parameters:
        - name: text_id
          in: path
          description: The text Id for which version is created
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/Post-text-version'
      responses:
        '200':
          $ref: '#/components/responses/Put-version-response'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  '/textmgr/text/{text_id}/version/{version}':
    put:
      summary: Update a text version (internal)
      description: |-
        Update a specific text version by providing what fields to update
        This API is not available publicly and is used only by internal Sonetel applications
      operationId: put-textmgr-text-text-id-version-version-id
      parameters:
        - name: text_id
          in: path
          description: The text Id for which version is updated
          required: true
          schema:
            type: string
        - name: version
          in: path
          description: The specific version being updated. `latest` may be specified to update the latest version
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/Put-text-version'
      responses:
        '200':
          $ref: '#/components/responses/Put-version-response'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
    delete:
      summary: Delete text version
      description: |-
        Delete a specific text version.
        Deleting a version deletes all later versions of the specified text and also resets the latest version
        A new version list is returned
      operationId: delete-textmgr-text-text-id-version-version-id
      parameters:
        - name: text_id
          in: path
          description: The text Id for which version is updated
          required: true
          schema:
            type: string
        - name: version
          in: path
          description: The specific version being updated. `latest` may be specified to update the latest version
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Delete-version'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  '/textmgr/text/{text_id}/write':
    post:
      summary: Write text (internal)
      description: |-
        Write processed or completion text.
        Used only internally by Sonetel applications, this endpoint enables applications to update the completion text or processed text
        The text is written is to the latest version of the text, unless a specific version is provided in the request.
        Since text may be written in chunks as it is received from other remote services, this endpoint enables an application to specify if the writing is completed or if it is an interim text update
      operationId: post-textmgr-text-text-id-write
      parameters:
        - name: version
          in: query
          description: Specify version which should be written to. Default is the latest
          schema:
            type: number
            examples:
              - 3
        - name: text_id
          in: path
          description: The text Id being written to
          required: true
          schema:
            type: string
      requestBody:
        description: The request specifies the version to be set as the latest version
        content:
          application/json:
            schema:
              type: object
              properties:
                text_type:
                  type: string
                  enum:
                    - processed_text
                    - completion_text
                  description: The field that should be updated - completion text or processed text
                  examples:
                    - completion_text
                text:
                  type: string
                  description: The text that should be be appended to the text written so far
                  examples:
                    - this text would be appended to the text already stored so far
                status:
                  type: string
                  enum:
                    - in_progress
                    - completed
                  description: Specifies is the text is final and the status can be changed to completed after writing. Or if more text is coming
                  examples:
                    - in_progress
                error:
                  type: object
                  properties:
                    code:
                      type: string
                      description: The error code in case of failure
                      examples:
                        - 4001233-yt
                    error_description:
                      type: string
                      description: A textual description of the error
                      examples:
                        - Not enough AI credits
              required:
                - text_type
                - text
                - status
      responses:
        '202':
          description: The submitted text has been accepted
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
      x-internal: true
  '/textmgr/text/{text_id}/business-description':
    get:
      summary: Get business description
      description: Fetch business description
      operationId: get-textmgr-text-id-business-description
      parameters:
        - name: version
          in: query
          description: 'The version that should be returned. If not specified, the latest version is returned'
          schema:
            type: number
            minimum: 1
            examples:
              - 2
        - name: text_id
          in: path
          description: The text Id for which business description should be returned
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-business-description-by-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  /textmgr/business-description:
    get:
      summary: List business description
      description: Fetch a list of business description
      operationId: get-txtmgr-business-description
      parameters:
        - name: account_id
          in: query
          description: List business descriptions for this account Id
          schema:
            type: string
        - name: business_id
          in: query
          description: List business descriptions for this business Id
          schema:
            type: string
        - name: user_id
          in: query
          description: List business descriptions for this user Id
          schema:
            type: string
        - name: status
          in: query
          description: List business descriptions with this status
          schema:
            type: string
            enum:
              - not_stated
              - in_progress
              - ready
            examples:
              - in_progress
        - name: version
          in: query
          description: 'List business descriptions for a specific version (provide version number, e.g. `version=2`) or all versions (`version=all`l)'
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-business-description-list'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  '/textmgr/text/{text-id}/webpage':
    get:
      summary: Get Web page
      description: Get web page data
      operationId: get-textmgr-text-text-id-webpage
      parameters:
        - name: text-id
          in: path
          description: The text Id of the web page
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-web-page-by-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  /textmgr/webpage:
    get:
      summary: List web pages
      description: Fetch a list of web pages based on criteria
      operationId: get-textmgr-webpage
      parameters:
        - name: account_id
          in: query
          description: List web pages for this account Id
          schema:
            type: string
        - name: business_id
          in: query
          description: List web pages for this business Id
          schema:
            type: string
        - name: user_id
          in: query
          description: List web pages for this user Id
          schema:
            type: string
        - name: status
          in: query
          description: List web pages with this status
          schema:
            type: string
            enum:
              - not_started
              - in_progress
              - ready
            examples:
              - in_progress
        - name: language
          in: query
          description: 'List web pages in this language. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
          schema:
            type: string
        - name: url
          in: query
          description: 'List web pages matching the url string. Search is done using [Lucene search syntax](https://lucene.apache.org/core/2_9_4/queryparsersyntax.html)'
          schema:
            type: string
            examples:
              - url=www.sonetel.com/en/*
        - name: page_type
          in: query
          description: List web pages matching this page type
          schema:
            type: string
            enum:
              - home
              - contact
              - product
        - name: parent_text_id
          in: query
          description: List web pages that have this text Id as parent
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-web-page-list'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  '/textmgr/text/{text_id}/blog-title-list':
    get:
      summary: Get blog title list
      description: Fetch a blog title list based on text Id
      operationId: get-textmgr-text-text_id-blog-title-list
      parameters:
        - name: version
          in: query
          description: 'Specify version required. If not specified, the latest is fetched. If `all` is specified, all versions are fetched. A specific version fetches the single required version'
          schema:
            type: string
            examples:
              - '1'
        - name: text_id
          in: path
          description: Text Id of the blog title list
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-blog-title-list-by-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  /textmgr/blog-title-list:
    get:
      summary: List Blog title lists
      description: Fetch blog title lists based on search criteria
      operationId: get-textmgr-blog-title-list
      parameters:
        - name: account_id
          in: query
          description: List blog title lists for this account Id
          schema:
            type: string
        - name: business_id
          in: query
          description: List blog title lists for this business Id
          schema:
            type: string
        - name: user_id
          in: query
          description: List blog title lists for this user Id
          schema:
            type: string
        - name: status
          in: query
          description: List blog title lists with this status
          schema:
            type: string
            enum:
              - not_started
              - ready
            examples:
              - not_started
        - name: language
          in: query
          description: 'List blog title lists in this language. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
          schema:
            type: string
        - name: version
          in: query
          description: 'List blog title lists for a specific version (provide version number, e.g. `version=2`) or all versions (`version=all`l)'
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-blog-title-lists'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  '/textmgr/text/{text_id}/blog':
    get:
      summary: Get blog article
      description: Fetch a blog article based on its text Id.
      operationId: get-textmgr-text-text_id-blog
      parameters:
        - name: text_id
          in: path
          description: The text Id of the blog article
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-blog-by-id'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
  /textmgr/blog:
    get:
      summary: List blogs
      description: Fetch a list of blogs based on search criteria
      operationId: get-textmgr-blog
      parameters:
        - name: account_id
          in: query
          description: List blogs for this account Id
          schema:
            type: string
        - name: business_id
          in: query
          description: List blogs for this business Id
          schema:
            type: string
        - name: user_id
          in: query
          description: List blogs for this user Id
          schema:
            type: string
        - name: status
          in: query
          description: List blogs with this status
          schema:
            type: string
            enum:
              - not_started
              - ready
            examples:
              - not_started
        - name: language
          in: query
          description: 'List blogs in this language. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
          schema:
            type: string
        - name: version
          in: query
          description: 'List blogs for a specific version (provide version number, e.g. `version=2`) or all versions (`version=all`l)'
          schema:
            type: string
        - name: title
          in: query
          description: List blogs with this title
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Get-blog-list'
      security:
        - Sonetel: []
      servers:
        - url: 'https://public-api.sonetel.com'
          description: Production
