components:
  requestBodies:
    Post-text:
      description: The data for the text object to be created. All fields except the type are optional
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                enum:
                  - business-description
                  - blog-title-list
                  - blog-article
                  - website
                  - webpage
                  - poem
                  - photo-search-terms
                  - marketing-email
                  - meeting-minutes
                  - vm-summary
                  - call-summary
                description: The text type
              language:
                type: string
                description: 'The language of the text language. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
                default: en
                examples:
                  - sv-sv
              account_id:
                type: string
                description: The Sonetel account Id
                examples:
                  - '52688784'
              business_id:
                type: string
                description: Optional business Id
                examples:
                  - 2hngtre
              user_id:
                type: string
                description: The user Id to which the text is associated
                examples:
                  - '19876'
              user_input:
                type: string
                description: The optional user specified input feedback text that is used by AI service for generating the final processed text
              parent_text_id:
                type: string
                description: The parent text Id to this text object
              in_use_with:
                $ref: '#/components/schemas/InUseWith'
                description: The services the text is in use with
            required:
              - type
        application/xml:
          schema:
            type: object
    Put-text-id:
      description: List of fields to be updated
      content:
        application/json:
          schema:
            type: object
            properties:
              business_id:
                type: string
                description: The business Id
                examples:
                  - 2hngtre
              user_id:
                type: string
                description: The user_id to which the text is associated
                examples:
                  - '19876'
              language:
                type: string
                description: 'Text available in this language should be returned. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
                minLength: 2
                maxLength: 35
                examples:
                  - sv-sv
              parent_text_id:
                type: string
                description: The parent text Id
                examples:
                  - hn3h8645s
    Put-text-version:
      description: Request fields to update a specific version of the text
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Text-version-object-no-Id'
    Post-text-version:
      description: List of fields while creating a new version
      content:
        application/json:
          schema:
            type: object
            properties:
              user_input:
                type: string
    Put-meeting-minutes:
      description: Update meeting minutes
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The meeting name
                examples:
                  - Europe sales
              meeting_date:
                type: string
                description: The date/time of the meeting.
                format: date-time
              notes:
                type: string
                description: Notes input by the user
              participants:
                type: array
                description: List of participants and their names
                items:
                  type: string
              auto_expire:
                type: string
                description: "The date time when this meeting minutes text must be deleted automatically.\r\nIf not specified or set to empty, this value implies that the text is never automatically deleted"
                format: date-time
  securitySchemes:
    Sonetel:
      type: oauth2
      description: Get an access token from the `/oauth/token` and pass it as a Bearer token in the `Authorization` header.
      flows:
        password:
          refreshUrl: 'https://api.sonetel.com/SonetelAuth/beta/oauth/token'
          tokenUrl: 'https://api.sonetel.com/SonetelAuth/beta/oauth/token'
          scopes: {}
  responses:
    delete-success:
      description: List of deleted text Ids
      content:
        application/json:
          schema:
            type: object
            properties:
              text_id_list:
                type: array
                description: List of text Ids that are deleted
                items:
                  type: string
                  examples:
                    - 4gh6354
            required:
              - text_id_list
            x-examples:
              example-1:
                status: SUCCESS
                message: 'Data deleted successfully. Account id : 200000000'
                response: null
          examples:
            Example 1:
              value:
                text_id_list:
                  - 4gh6354
                  - gnr873654
    Create-text-response:
      description: The newly created text object
      content:
        application/json:
          schema:
            type: object
            properties:
              text_id:
                type: string
                description: The unique text Id
                examples:
                  - hn3h8645s
              type:
                type: string
                enum:
                  - business-description
                  - blog-title-list
                  - blog-article
                  - website
                  - webpage
                  - poem
                  - photo-search-terms
                  - marketing-email
                  - meeting-minutes
                  - vm-summary
                  - call-summary
                description: The text type
              language:
                type: string
                description: 'Text available in this language should be returned. [2 char ISO](https://en.wikipedia.org/wiki/ISO_639-1) or [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag)'
              account_id:
                type: string
                description: The Sonetel account Id
                examples:
                  - '52688784'
              business_id:
                type: string
                description: Optional business Id
                examples:
                  - 2hngtre
              user_id:
                type: string
                description: The user Id to which the text is associated
                examples:
                  - '19876'
              user_input:
                type: string
                description: The optional user specified input feedback text that is used by AI service for generating the final processed text
              in_use_with:
                $ref: '#/components/schemas/InUseWith'
                description: The services the text is in use with
            required:
              - type
              - language
              - account_id
            x-examples:
              Example 1:
                id: text_id
                text: <Prepared-text>
    Text-list:
      description: A list of text objects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Text'
    Get-text-id:
